<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Zuka News" />
  <meta name="theme-color" content="#7d5ba6" />
  <title>Zuka News - 宝塚歌劇ニュースまとめ</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Web App / Favicon / Android & iOS Homescreen Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icons/icon-64.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Zuka News" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-container">

    <!-- ====================================================================
         Passcode Overlay (0310)
         ==================================================================== -->
    <div id="authOverlay" class="auth-overlay">
      <div class="auth-card">
        <div class="auth-icon-wrap">
          <img src="assets/icons/icon-192.png" alt="Zuka News 猫ロゴ" class="auth-logo-img" />
        </div>
        <h1 class="auth-title">Zuka News</h1>
        <p class="auth-subtitle">パスコードを入力してください</p>

        <!-- Dots Display -->
        <div class="auth-dots">
          <div class="auth-dot"></div>
          <div class="auth-dot"></div>
          <div class="auth-dot"></div>
          <div class="auth-dot"></div>
        </div>

        <div id="authError" class="auth-error"></div>

        <!-- Keypad -->
        <div id="authKeypad" class="auth-keypad">
          <button type="button" class="auth-key" data-key="1">1</button>
          <button type="button" class="auth-key" data-key="2">2</button>
          <button type="button" class="auth-key" data-key="3">3</button>
          <button type="button" class="auth-key" data-key="4">4</button>
          <button type="button" class="auth-key" data-key="5">5</button>
          <button type="button" class="auth-key" data-key="6">6</button>
          <button type="button" class="auth-key" data-key="7">7</button>
          <button type="button" class="auth-key" data-key="8">8</button>
          <button type="button" class="auth-key" data-key="9">9</button>
          <button type="button" class="auth-key func-key" data-key="clear">取消</button>
          <button type="button" class="auth-key" data-key="0">0</button>
          <button type="button" class="auth-key func-key" data-key="delete">⌫</button>
        </div>

        <label class="auth-footer-options">
          <input type="checkbox" id="rememberMeCheckbox" checked />
          <span>ログイン状態を保持する</span>
        </label>
      </div>
    </div>

    <!-- ====================================================================
         Main App Header
         ==================================================================== -->
    <header class="site-header">
      <div class="header-brand">
        <div class="brand-icon-wrap">
          <img src="assets/icons/icon-192.png" alt="Zuka News 猫ロゴ" class="brand-logo-img" />
        </div>
        <div class="brand-titles">
          <span class="brand-name">Zuka News</span>
          <span class="brand-tagline">Takarazuka Revue News</span>
        </div>
      </div>

      <div class="header-actions">
        <!-- Unread Pill -->
        <div id="unreadCountBadge" class="unread-badge-pill" style="display: none;">
          <span class="unread-dot"></span> 未読 0
        </div>

        <!-- Search Toggle -->
        <button id="searchToggleBtn" class="icon-btn" title="検索" aria-label="検索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>

        <!-- Lock / Logout -->
        <button id="lockAppBtn" class="icon-btn" title="画面をロック" aria-label="画面をロック">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- ====================================================================
         Troupe Tabs Selector
         ==================================================================== -->
    <section class="troupe-tabs-section">
      <div class="troupe-tabs-scroll">
        <button class="troupe-tab active" data-troupe="all">全組</button>
        <button class="troupe-tab" data-troupe="flower">🌸 花組</button>
        <button class="troupe-tab" data-troupe="moon">🌙 月組</button>
        <button class="troupe-tab" data-troupe="snow">❄️ 雪組</button>
        <button class="troupe-tab" data-troupe="star">⭐ 星組</button>
        <button class="troupe-tab" data-troupe="cosmos">🪐 宙組</button>
        <button class="troupe-tab" data-troupe="senka">💎 専科</button>
      </div>
    </section>

    <!-- ====================================================================
         Top Stars Quick Selector
         ==================================================================== -->
    <!-- ====================================================================
         Top Stars Quick Selector (Collapsible)
         ==================================================================== -->
    <section class="star-filter-section is-collapsed" id="starFilterSection">
      <div class="star-section-header">
        <button id="toggleStarCollapseBtn" class="star-section-toggle-btn" aria-expanded="false" aria-label="スター一覧の開閉">
          <div class="star-toggle-title">
            <span class="star-toggle-icon-sparkle">✨</span>
            <span class="star-toggle-label">スターで探す</span>
            <span class="star-toggle-chevron">▾</span>
          </div>
          <span id="starActiveBadge" class="star-active-badge" style="display: none;"></span>
        </button>
        <button id="manageFocusedStarsBtn" class="focus-stars-manage-btn" title="注目スター（推し）を設定">
          <span>💖 注目スター設定</span>
        </button>
      </div>
      <div class="star-scroll" id="starScrollContainer">
        <!-- ⭐ 星組 -->
        <div class="star-chip" data-star="礼真琴">
          <div class="star-avatar-wrap">
            <div class="star-avatar" style="color:#256bb8;">⭐</div>
          </div>
          <span class="star-name">礼真琴</span>
        </div>

        <div class="star-chip" data-star="暁千星">
          <div class="star-avatar-wrap">
            <div class="star-avatar" style="color:#256bb8;">⭐</div>
          </div>
          <span class="star-name">暁千星</span>
        </div>

        <div class="star-chip" data-star="詩ちづる">
          <div class="star-avatar-wrap">
            <div class="star-avatar" style="color:#256bb8;">⭐</div>
          </div>
          <span class="star-name">詩ちづる</span>
        </div>

        <div class="star-chip" data-star="天飛華音">
          <div class="star-avatar-wrap">
            <div class="star-avatar" style="color:#256bb8;">⭐</div>
          </div>
          <span class="star-name">天飛華音</span>
        </div>

        <!-- 🌸 花組 -->
        <div class="star-chip" data-star="永久輝せあ">
          <div class="star-avatar-wrap">
            <div class="star-avatar" style="color:#e87a90;">🌸</div>
          </div>
          <span class="star-name">永久輝せあ</span>
        </div>

        <div class="star-chip" data-star="星空美咲">
          <div class="star-avatar-wrap">
            <div class="star-avatar" style="color:#e87a90;">🌸</div>
          </div>
          <span class="star-name">星空美咲</span>
        </div>

        <div class="star-chip" data-star="聖乃あすか">
          <div class="star-avatar-wrap">
            <div class="star-avatar" style="color:#e87a90;">🌸</div>
          </div>
          <span class="star-name">聖乃あすか</span>
        </div>

        <div class="star-chip" data-star="極美慎">
          <div class="star-avatar-wrap">
            <div class="star-avatar" style="color:#e87a90;">🌸</div>
          </div>
          <span class="star-name">極美慎</span>
        </div>

        <!-- 🪐 宙組 -->
        <div class="star-chip" data-star="桜木みなと">
          <div class="star-avatar-wrap">
            <div class="star-avatar" style="color:#7b5294;">🪐</div>
          </div>
          <span class="star-name">桜木みなと</span>
        </div>

        <div class="star-chip" data-star="春乃さくら">
          <div class="star-avatar-wrap">
            <div class="star-avatar" style="color:#7b5294;">🪐</div>
          </div>
          <span class="star-name">春乃さくら</span>
        </div>

        <div class="star-chip" data-star="水美舞斗">
          <div class="star-avatar-wrap">
            <div class="star-avatar" style="color:#7b5294;">🪐</div>
          </div>
          <span class="star-name">水美舞斗</span>
        </div>

        <div class="star-chip" data-star="瑠風輝">
          <div class="star-avatar-wrap">
            <div class="star-avatar" style="color:#7b5294;">🪐</div>
          </div>
          <span class="star-name">瑠風輝</span>
        </div>

        <!-- 🌙 月組 -->
        <div class="star-chip" data-star="鳳月杏">
          <div class="star-avatar-wrap">
            <div class="star-avatar" style="color:#d49826;">🌙</div>
          </div>
          <span class="star-name">鳳月杏</span>
        </div>

        <div class="star-chip" data-star="天紫珠李">
          <div class="star-avatar-wrap">
            <div class="star-avatar" style="color:#d49826;">🌙</div>
          </div>
          <span class="star-name">天紫珠李</span>
        </div>

        <div class="star-chip" data-star="風間柚乃">
          <div class="star-avatar-wrap">
            <div class="star-avatar" style="color:#d49826;">🌙</div>
          </div>
          <span class="star-name">風間柚乃</span>
        </div>

        <!-- ❄️ 雪組 -->
        <div class="star-chip" data-star="朝美絢">
          <div class="star-avatar-wrap">
            <div class="star-avatar" style="color:#2b8270;">❄️</div>
          </div>
          <span class="star-name">朝美絢</span>
        </div>

        <div class="star-chip" data-star="音彩唯">
          <div class="star-avatar-wrap">
            <div class="star-avatar" style="color:#2b8270;">❄️</div>
          </div>
          <span class="star-name">音彩唯</span>
        </div>

        <div class="star-chip" data-star="瀬央ゆりあ">
          <div class="star-avatar-wrap">
            <div class="star-avatar" style="color:#2b8270;">❄️</div>
          </div>
          <span class="star-name">瀬央ゆりあ</span>
        </div>

        <div class="star-chip" data-star="縣千">
          <div class="star-avatar-wrap">
            <div class="star-avatar" style="color:#2b8270;">❄️</div>
          </div>
          <span class="star-name">縣千</span>
        </div>
      </div>
    </section>

    <!-- ====================================================================
         Search Bar (Toggleable)
         ==================================================================== -->
    <section id="searchContainer" class="search-container">
      <div class="search-input-wrap">
        <svg class="search-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="スター名や演目名で検索..." />
        <button id="searchClearBtn" class="search-clear-btn" title="クリア">✕</button>
      </div>
    </section>

    <!-- ====================================================================
         Controls Bar (Unread toggle, Mark all read)
         ==================================================================== -->
    <section class="controls-bar">
      <div class="filter-pills-wrap">
        <button id="unreadToggleBtn" class="pill-toggle-btn">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="7"/>
          </svg>
          未読のみ
        </button>
      </div>

      <div class="actions-right">
        <button id="markAllReadBtn" class="mark-all-read-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          すべて既読
        </button>
      </div>
    </section>

    <!-- ====================================================================
         Latest News Highlights Digest (最新ニュース見どころ！)
         ==================================================================== -->
    <section id="newsDigestSection" class="news-digest-section">
      <div class="digest-card">
        <div class="digest-header">
          <div class="digest-title-group">
            <span class="digest-sparkle">✨</span>
            <span class="digest-title">最新ニュース見どころ！</span>
            <span id="digestBadge" class="digest-badge">未読厳選</span>
          </div>
          <span id="digestCounter" class="digest-counter"></span>
        </div>
        <div class="digest-body" id="digestBody">
          <!-- Dynamically populated with 3-line highlights -->
        </div>
      </div>
    </section>

    <!-- ====================================================================
         News Feed
         ==================================================================== -->
    <main id="newsFeed" class="news-feed">
      <!-- Dynamically filled with .news-card items -->
    </main>

    <!-- Empty State Container -->
    <div id="emptyState" class="empty-state" style="display: none;">
      <div class="empty-state-icon">🌸</div>
      <div class="empty-state-title">ニュースがありません</div>
      <div class="empty-state-desc">条件に合うニュースが見つかりませんでした。</div>
    </div>

    <!-- ====================================================================
         Bottom Navigation Bar
         ==================================================================== -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-target="feed">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>最新</span>
      </button>

      <button class="nav-item" data-target="favorites">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        <span>お気に入り</span>
      </button>

      <button class="nav-item" data-target="stars">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <span>スター一覧</span>
      </button>

      <button class="nav-item" data-target="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>検索</span>
      </button>
    </nav>

    <!-- ====================================================================
         Star List Drawer Modal
         ==================================================================== -->
    <div id="starDrawerModal" class="modal-overlay">
      <div class="modal-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <div>
            <h2 class="sheet-title">宝塚スター一覧</h2>
            <p class="sheet-subtitle" style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">
              💖をタップして注目スターに登録すると、ニュースが上位に優先表示されます✨
            </p>
          </div>
          <button id="closeStarDrawerBtn" class="sheet-close-btn" aria-label="閉じる">✕</button>
        </div>
        <div id="starDrawerList" class="star-grid">
          <!-- Dynamically filled with star items -->
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toastMsg" class="toast-msg"></div>

  </div>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
